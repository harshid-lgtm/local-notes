# Builds installers for Windows, macOS and Linux and attaches them to a GitHub Release.
# Trigger: push a tag like v1.0.0  (git tag v1.0.0 && git push --tags)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle the team server for "Host a team server on this computer"
        run: |
          npm ci --prefix team-server --omit=dev
          npm run build:team-bundle
      - name: Build and publish installers
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing certificates yet: macOS builds are ad-hoc signed, Windows builds unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach the team server package (used by the Linux installer)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          npm run pack:team-server
          gh release upload "$GITHUB_REF_NAME" dist/local-notes-team-server.tar.gz dist/local-notes-team-server.tar.gz.sha256 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
